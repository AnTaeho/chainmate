[package]
name = "chainmate"
version = "0.1.0"
description = "체인메이트 — 먹은 기물로 바뀌며 이어 먹는 체스 퍼즐 로그라이크"
edition = "2021"
publish = false

# iOS는 정적 라이브러리로 묶는다(Tauri 2 모바일). 맥 앱은 main.rs가 같은 run()을 부른다
[lib]
name = "chainmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
